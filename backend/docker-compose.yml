version: '3.8'

services:
  db:
    image: mariadb:lts
    container_name: kantin_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: kantin_db
      MYSQL_USER: kantin_user
      MYSQL_PASSWORD: kantin_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  api:
    build: .
    container_name: kantin_api
    restart: always
    depends_on:
      - db
    ports:
      - "3005:3000"
    environment:
      # Use the internal docker network to connect to the db service
      DATABASE_URL: "mysql://kantin_user:kantin_password@db:3306/kantin_db"
      JWT_SECRET: "your_super_secret_jwt_key_here"
      JWT_REFRESH_SECRET: "your_super_secret_jwt_refresh_key_here"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      PORT: 3000
      APP_URL: "http://localhost:3000"
    volumes:
      # Persist the uploads directory outside the container
      - api_uploads:/app/uploads

volumes:
  mariadb_data:
  api_uploads:
